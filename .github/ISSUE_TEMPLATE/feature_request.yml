name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, please — it often has a simpler solution than the one imagined.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Existing commands, `sgh exec`, direnv, shell aliases...
